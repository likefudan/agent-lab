name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: macos-15  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap
        run: ./bootstrap.sh
      - name: Ruff
        run: |
          . .tools/env.sh
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Mypy
        run: |
          . .tools/env.sh
          uv run --frozen mypy
      - name: Unit tests
        run: |
          . .tools/env.sh
          uv run --frozen pytest
      - name: Doctor
        run: ./alab doctor

  acceptance:
    name: Isolation and bootstrap acceptance
    runs-on: macos-15  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5
      - name: T01 acceptance checks
        run: tests/acceptance.sh

  models:
    name: Model download acceptance
    runs-on: macos-15  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5
      - name: T02 acceptance checks (downloads the CI model)
        run: tests/models_acceptance.sh

  backend:
    name: Backend acceptance
    runs-on: macos-15  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5
      - name: T04 acceptance checks (serves the CI model)
        run: tests/backend_acceptance.sh

  gateway:
    name: Gateway acceptance
    runs-on: macos-15  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5
      - name: T05 acceptance checks (the CI model behind the gateway)
        run: tests/gateway_acceptance.sh

  bench:
    name: Benchmark flow
    runs-on: macos-15  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5
      - name: T06 acceptance checks (a quick alab bench with the CI model)
        run: tests/bench_acceptance.sh
