[project]
name = "agent-lab"
version = "0.1.0"
description = "Self-contained local LLM serving on Apple Silicon: Qwen3.8-27B with mlx-lm behind an OpenAI-compatible gateway."
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    # The gateway (T05): an ASGI app served by uvicorn, forwarding to the backend with httpx.
    "httpx>=0.28.1",
    "starlette>=0.52",
    "uvicorn>=0.40",
    # The gateway counts prompt tokens with the model's own tokenizer and chat template.
    # mlx-lm already depends on it on macOS; listed here so the gateway and its tests
    # also run on Linux. Must stay within mlx-lm's own requirement.
    "transformers>=5.7,<6",
    "jinja2>=3.1",  # transformers renders chat templates with it but does not require it
    # transformers 5.x (needed by mlx-lm) requires huggingface-hub below 2.0.
    "huggingface-hub>=1.33.0,<2",
    # Pinned exactly: MLX reads Metal's recommended working set (T03) and T04's
    # mlx-lm must stay compatible with this version. macOS only, like mlx-lm.
    "mlx==0.32.3; platform_system == 'Darwin'",
    # Pinned exactly: the launch wrapper hooks into mlx_lm.server internals (T04).
    # 0.32.0 runs Qwen3.8 (model_type qwen3_5) and has the qwen3_coder tool parser.
    "mlx-lm==0.32.0; platform_system == 'Darwin'",
]

[project.scripts]
alab = "agent_lab.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    # The official SDK, for the gateway's integration test (T05).
    "openai>=2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
cache-dir = "var/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
cache_dir = "var/cache/mypy"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "var/cache/pytest"
addopts = "-ra"

[[tool.mypy.overrides]]
# huggingface_hub.utils re-exports its helpers lazily without __all__-style markers.
module = "huggingface_hub.*"
implicit_reexport = true

[[tool.mypy.overrides]]
# MLX and mlx-lm are only installed on macOS. Skip them everywhere so type checks
# give the same result on Linux (development) and macOS (CI).
module = ["mlx.*", "mlx_lm.*"]
ignore_missing_imports = true
follow_imports = "skip"
