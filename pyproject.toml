[project]
name = "agent-lab"
version = "0.1.0"
description = "Self-contained local LLM serving on Apple Silicon: Qwen3.8-27B with mlx-lm behind an OpenAI-compatible gateway."
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "huggingface-hub>=2.1.1",
    # Pinned exactly: MLX reads Metal's recommended working set (T03) and T04's
    # mlx-lm must stay compatible with this version. macOS only, like mlx-lm.
    "mlx==0.32.3; platform_system == 'Darwin'",
]

[project.scripts]
alab = "agent_lab.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
cache-dir = "var/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
cache_dir = "var/cache/mypy"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "var/cache/pytest"
addopts = "-ra"

[[tool.mypy.overrides]]
# huggingface_hub.utils re-exports its helpers lazily without __all__-style markers.
module = "huggingface_hub.*"
implicit_reexport = true

[[tool.mypy.overrides]]
# MLX is only installed on macOS; on Linux (development) the import is untyped.
module = "mlx.*"
ignore_missing_imports = true
