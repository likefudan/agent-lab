# Profile for CI and integration tests: the tiny Qwen3-0.6B model on a small
# GitHub Actions macOS runner (about 7GB of memory). Not for real use.
# Sizes use binary units: 1GB = 1024^3 bytes.

[model]
id = "qwen3-0.6b-mlx-4bit"

[backend]
port = 8100
prefill_step_size = 2048
prompt_cache_size = 1
prompt_cache_bytes = "256MB"
metal_memory_limit = "1.5GB"
tool_parser = "auto"              # Qwen3 (not 3.5+) uses the JSON format mlx-lm detects
enable_thinking = false
temperature = 0.7
top_p = 0.8
top_k = 20
thinking_temperature = 0.6        # with thinking (reasoning_effort low/medium/high):
thinking_top_p = 0.95             # the model card's values for precise coding tasks
thinking_top_k = 20
start_timeout_seconds = 300

[gateway]
port = 8000
model_name = "qwen3-0.6b"
max_context = 8192
max_output_tokens = 1024
min_output_tokens = 256
queue_size = 4
heartbeat_seconds = 15

[tunnel]
enabled = false
hostname = "api.llmat.dev"

[system]
gpu_wired_limit_mb = 2048
